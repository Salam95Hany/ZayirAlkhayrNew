<div class="d-flex align-items-center flex-wrap gap-2 mb-2">
    <ng-container *ngFor="let filter of FilterList">
        <!-- TEXT FILTER -->
        <div *ngIf="filter.filterType === 'SearchText'" class="position-relative">
            <div class="input-group max-width-300 min-width-300">
                <span class="input-group-text bg-light" (click)="updateFilters(filter)">
                    <button class="border-0 bg-transparent">
                        <i class="fas fa-search"></i>
                    </button>
                </span>
                <input type="text" class="form-control" [(ngModel)]="filter.itemId" (keyup.enter)="updateFilters(filter)" [placeholder]="'البحث ' + (filter.categoryDisplayName) + '...'">
            </div>
        </div>

        <!-- DATE FILTER -->
        <div *ngIf="filter.filterType === 'Day'" class="custom-date-input position-relative">
            <span class="date-label" *ngIf="!filter.itemId">{{filter.categoryDisplayName}}</span>
            <input type="date" class="form-control width-250 cursor-pointer" [(ngModel)]="filter.itemId" (change)="updateFilters(filter)" />
        </div>

        <!-- MONTH FILTER -->
        <div *ngIf="filter.filterType === 'Month'" class="custom-date-input position-relative">
            <span class="date-label" *ngIf="!filter.itemId">{{filter.categoryDisplayName}}</span>
            <input type="month" class="form-control width-250 cursor-pointer" [(ngModel)]="filter.itemId" (change)="updateFilters(filter)" />
        </div>

        <!-- DATE RANGE FILTER -->
        <div *ngIf="filter.filterType === 'DateRange'" class="date-picker-flex" style="height: 37px;">
            <i class="fa fa-calendar calendar-icon"></i>
            <input type="text" ngxDaterangepickerMd [(ngModel)]="filter.itemId" (datesUpdated)="updateFilters(filter, $event)" [locale]="{ applyLabel: 'Apply', format: 'YYYY-MM-DD' }" [autoApply]="true" autocomplete="off" [placeholder]="filter.categoryDisplayName"
                class="date-range-input" />
        </div>

        <!-- CHECKBOX FILTER -->
        <div *ngIf="filter.filterType === 'Checkbox'" ngbDropdown #dropdown="ngbDropdown" class="dropdown-filter-wrapper d-inline-block">
            <button type="button" class="filter-button border px-3 py-2 rounded bg-white min-width-100 d-flex align-items-center justify-content-between" id="filterInput1" ngbDropdownToggle>
                <i class="uil uil-filter me-1"></i>
                <span>{{filter.categoryDisplayName}}</span>
                
            </button>
            <div ngbDropdownMenu aria-labelledby="filterInput1" class="dropdown-filter p-0 overflow-hidden" container="body">
                <div class="p-2 bg-light border-bottom">
                    <input type="text" [(ngModel)]="filterSearch" class="form-control form-control-sm" placeholder="بحث..." />
                </div>
                <div class="erp-filter-box small-scroll">
                    <div class="check-row px-2" *ngFor="let filterItem of filter.filterItems | searchArry: filterSearch:['itemKey'];let x = index">
                        <div class="form-check">
                            <input class="form-check-input" [(ngModel)]="filterItem.isChecked" (change)="updateFilters(filter);dropdown.close()" type="checkbox" id="filter-input_{{filter.categoryName}}_{{filterItem.itemValue}}_{{i}}_{{x}}">
                            <label class="form-check-label d-flex align-items-center justify-content-between w-100 pe-2" for="filter-input_{{filter.categoryName}}_{{filterItem.itemValue}}_{{i}}_{{x}}">
                                <span>{{filterItem.itemKey}}</span>
                                <span>{{filterItem.itemValue}}</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</div>

<!-- Selected filters display -->
<div class="d-flex align-items-center flex-wrap gap-2 mt-2">
    <div class="badge badge-success round fs-15" *ngFor="let selected of SelectedFilter; let i = index">
        <i class="fas fa-times-circle font-small-3 px-02 cursor-pointer me-1" (click)="removeSelectedFilter(selected, i)"></i>
        <span class="me-1">
            {{selected.categoryDisplayName}} :
            <ng-container *ngIf="selected.from; else normalFilter">
                {{selected.from}} - {{selected.to}}
            </ng-container>
            <ng-template #normalFilter>{{selected.itemKey}}</ng-template>
        </span>

    </div>

    <div class="badge badge-danger round fs-15" *ngIf="SelectedFilter.length > 0">
        <i class="fas fa-times-circle font-small-3 px-02 cursor-pointer" (click)="removeAllFilters()"></i> مسح الكل
    </div>
</div>
