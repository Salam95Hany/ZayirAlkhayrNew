<h3 class="text-center main-color mb-5 display-5">الصور</h3>
<div class="row gy-4">
  <div class="col-sm-6 col-lg-4 col-xl-3" *ngFor="let item of PhotosData">
    <div class="photo-card">
      <div class="photo-card-image img-thumbnail position-relative" routerLink="/photo-details/{{item.id}}">
        <img src="{{item.image}}" class="photo-img" loading="lazy" alt="" />
        <div class="photo-card-icon">
          <i class="fas fa-link"></i>
        </div>
      </div>
      <h5 class="photo-title fw-bold main-color m-0">{{item.title}}</h5>
      <span class="photo-date text-muted">{{item.insertDateAr}}</span>
    </div>
  </div>
</div>
