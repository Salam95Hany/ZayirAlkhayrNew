<h3 class="text-center main-color mb-5 display-5">الفعاليات</h3>
<div class="event-card" *ngFor="let item of EventsData">
    <div class="event-date">
        <span class="event-name">{{item.month}}</span>
    </div>
    <div class="event-details">
        <div class="row gy-3 mb-2" *ngFor="let event of item.events">
            <div class="col-lg-8 d-flex align-items-center">
                <div class="event-info">
                    <h4 class="fw-bold mb-2 main-color">{{event.title}}</h4>
                    <span class="fs-14px" *ngIf="event.fromDateStr && event.toDateStr">{{event.fromDateStr}} -
                        {{event.toDateStr}}</span>
                    <p class="m-0 mt-3">{{event.description}}</p>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="event-image img-thumbnail shadow-sm event-carousel">
                    <swiper-container *ngIf="event?.images?.length > 0" dir="rtl" navigation="true" pagination='{"clickable": true}' loop="false" space-between="20" [initialSlide]="1" [breakpoints]="{
        '0': { 'slidesPerView': 1 },
        '575': { 'slidesPerView': 1 },
        '767': { 'slidesPerView': 1 },
        '1024': { 'slidesPerView': 1 },
        '1200': { 'slidesPerView': 1 }
      }" style="
    --swiper-navigation-color: #fff;
    --swiper-navigation-size: 35px;
  ">
                        <swiper-slide *ngFor="let item of event?.images">
                            <div class="khairy-box h-100">
                                <div class="kahiry-img">
                                    <img [src]="item" loading="lazy" alt="khairy-images" class="img-fluid rounded shadow-sm" />
                                </div>
                            </div>
                        </swiper-slide>
                    </swiper-container>
                </div>
            </div>
        </div>
    </div>
</div>
