<div class="container py-5 bg-light shadow rounded" style="margin-top: 20px;">
    <div class="row mb-4">
        <div class="col-md-2 text-center">
            <i class="fa fa-check-circle fa-5x text-success mb-3"></i>
            <p class="text-muted">تم الانتهاء بنجاح</p>
        </div>
        <div class="col-md-10">
            <h3 class="fw-bold text-primary mb-3">شكراً لدعمكم!</h3>
            <p class="mb-4" style="font-size: 1.25rem; line-height: 1.6;">
                بفضل الله ثم دعمكم، تم الانتهاء من جمع تبرعات مشروع صدقة جارية {{ProjectName}}.
                <span *ngIf="ProjectsList.length > 0">يمكنكم الآن الاطلاع على المشاريع الأخرى لمؤسسة زائر الخير والاستمرار في المساهمة.</span>
            </p>
            <div class="d-flex align-items-center gap-2">
                <a class="btn btn-primary px-4 py-2" routerLink="/">زيارة الموقع</a>
                <i class="uil uil-sign-in-alt fs-4 text-primary"></i>
            </div>
        </div>
    </div>

    <div class="table-responsive" *ngIf="ProjectsList.length > 0">
        <table class="table table-bordered align-middle table-dark table-hover border shadow-lg bg-white m-0">
            <thead>
                <tr>
                    <th>المشروع</th>
                    <th>الرابط</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of ProjectsList">
                    <td>{{item.name}}</td>
                    <td>
                        <a href="{{item.url}}" target="_blank">{{item.url}}</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
