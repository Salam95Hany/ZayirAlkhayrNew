<app-za-breadcrumb [TitleList]="TitleList"></app-za-breadcrumb>

<div class="dashboard-container">
    <h1><i class="fas fa-chart-line me-2"></i>المعلومات المالية</h1>

    <!-- Filter Section -->
    <div class="filter-section">
        <app-za-filters [FilterList]="filterList" (filterChanged)="FilterChecked($event)"></app-za-filters>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-4">
        <div class="col-md-4">
            <div class="stat-card import">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-label">إجمالي الإيرادات</div>
                        <div class="stat-value" id="totalImport">{{TotalImportValue | number}} ج.م</div>
                        <small><i class="fas fa-arrow-up me-1"></i>12% من الشهر الماضي</small>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-download"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card export">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-label">إجمالي المصروفات</div>
                        <div class="stat-value" id="totalExport">{{TotalExportValue | number}} ج.م</div>
                        <small><i class="fas fa-arrow-up me-1"></i>8% من الشهر الماضي</small>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-upload"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card net">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="stat-label">الباقي</div>
                        <div class="stat-value" id="netValue">{{NetValue | number}} ج.م</div>
                        <small><i class="fas fa-chart-line me-1"></i>نظرة عامة على الرصيد</small>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-balance-scale"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
