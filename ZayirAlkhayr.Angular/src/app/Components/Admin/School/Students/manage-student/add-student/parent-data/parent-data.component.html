<form class="guardian-form" [formGroup]="ItemForm" autocomplete="off">
  <div class="form-section-heading">
    <span class="form-section-heading__icon"><i class="fa-solid fa-address-card"></i></span>
    <span><strong>بيانات ولي الأمر الأساسية</strong><small>ستُستخدم هذه البيانات للتواصل والمتابعة مع الأسرة.</small></span>
  </div>

  <div class="form-grid">
    <div class="form-field form-field--wide">
      <label>اسم ولي الأمر <span>*</span></label>
      <app-za-input-with-label type="text" placeholder="أدخل الاسم الكامل لولي الأمر" formControlName="parentName" [error]="formErrors.parentName"></app-za-input-with-label>
    </div>

    <div class="form-field">
      <label>رقم هاتف الأب</label>
      <app-za-input-with-label type="text" placeholder="أدخل رقم هاتف الأب" formControlName="fatherPhone" [allowNumbersOnly]="true"></app-za-input-with-label>
    </div>
    <div class="form-field">
      <label>رقم هاتف الأم</label>
      <app-za-input-with-label type="text" placeholder="أدخل رقم هاتف الأم" formControlName="motherPhone" [allowNumbersOnly]="true"></app-za-input-with-label>
    </div>
    <div class="form-field">
      <label>رقم واتساب</label>
      <app-za-input-with-label type="text" placeholder="أدخل رقم التواصل عبر واتساب" formControlName="whatsappNumber" [allowNumbersOnly]="true"></app-za-input-with-label>
    </div>
    <div class="form-field">
      <label>العنوان <span>*</span></label>
      <app-za-input-with-label type="text" placeholder="أدخل عنوان السكن بالتفصيل" formControlName="address" [error]="formErrors.address"></app-za-input-with-label>
    </div>
  </div>

  <div class="contact-note"><i class="fa-solid fa-circle-info"></i><span>يجب إدخال رقم هاتف واحد على الأقل للأب أو الأم لإكمال التسجيل.</span></div>
</form>
